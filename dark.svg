<radialGradient id="glow">
<stop offset="0%" stop-color="#2563EB" stop-opacity=".40"/>
<stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
</radialGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".40"/>
</filter>

<style>
.title{ font:700 42px Segoe UI; fill:white; }
.subtitle{ font:600 22px Segoe UI; fill:#CBD5E1; }
.body{ font:16px Segoe UI; fill:#94A3B8; }
