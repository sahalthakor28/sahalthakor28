<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-opacity=".15"/></filter>
    <style>
      .title{font:700 36px "Segoe UI", sans-serif;fill:url(#primary);} 
      .subtitle{font:600 18px "Segoe UI", sans-serif;fill:#334155;} 
      .body{font:14px "Segoe UI", sans-serif;fill:#64748B;} 
      .head{font:700 18px "Segoe UI", sans-serif;fill:#2563EB;} 
      .term{font:14px Consolas,monospace;fill:#111827;} 
      .small{font:13px "Segoe UI", sans-serif;fill:#475569;}
    </style>
  </defs>

  <rect width="1180" height="610" rx="18" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="20" y="20" width="1140" height="52" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="45" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="65" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="85" cy="46" r="6" fill="#27C93F"/>
  <text x="590" y="51" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">Muhammad Sahal — profile.sh --live</text>

  <!-- Hero -->
  <text x="60" y="135" class="title">MUHAMMAD SAHAL</text>
  <text x="60" y="170" class="subtitle">Computer Engineering Graduate</text>
  <text x="60" y="198" class="body">ERP Developer • AI &amp; Machine Learning Enthusiast</text>

  <!-- Status -->
  <circle cx="66" cy="225" r="6" fill="#22C55E">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="230" class="small">Available for Opportunities</text>

  <!-- Profile Card -->
  <rect x="60" y="260" width="310" height="300" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="82" y="295" class="head">Developer Profile</text>
  <line x1="82" y1="305" x2="340" y2="305" stroke="#E5E7EB"/>
  <text x="82" y="340" class="small">👤 Muhammad Sahal</text>
  <text x="82" y="370" class="small">🎓 Computer Engineering Graduate</text>
  <text x="82" y="400" class="small">💼 ERP Developer</text>
  <text x="82" y="430" class="small">🤖 AI &amp; Machine Learning</text>
  <text x="82" y="460" class="small">📍 India</text>
  <text x="82" y="490" class="small">🌐 github.com/sahalthakor28</text>

  <!-- Terminal -->
  <rect x="410" y="260" width="710" height="300" rx="18" fill="#0F172A"/>
  <circle cx="435" cy="285" r="6" fill="#FF5F56"/>
  <circle cx="455" cy="285" r="6" fill="#FFBD2E"/>
  <circle cx="475" cy="285" r="6" fill="#27C93F"/>
  <text x="510" y="290" font-family="Consolas" font-size="13" fill="#94A3B8">terminal</text>
  <text x="440" y="330" font-family="Consolas" font-size="13" fill="#22C55E">$ whoami</text>
  <text x="440" y="360" font-family="Consolas" font-size="13" fill="#E2E8F0">Muhammad Sahal</text>
  <text x="440" y="390" font-family="Consolas" font-size="13" fill="#E2E8F0">Computer Engineering Graduate</text>
  <text x="440" y="420" font-family="Consolas" font-size="13" fill="#E2E8F0">ERP Developer</text>
  <text x="440" y="450" font-family="Consolas" font-size="13" fill="#E2E8F0">AI &amp; Machine Learning Enthusiast</text>

  <!-- Footer -->
  <line x1="60" y1="560" x2="1120" y2="560" stroke="#E2E8F0"/>
  <text x="590" y="585" text-anchor="middle" font-size="13" fill="#64748B">Designed &amp; Developed by Muhammad Sahal • 2026</text>

</svg>
